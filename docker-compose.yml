services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

  # NOTE : This combines Apache Kafka 4.1.1 with Confluent Schema Registry 8.1.1.
  # If the registry fails to initialize against this Kafka version,
  # we'll inspect its logs and choose a compatible configuration
  # rather than proceeding with a broken service.

  schema-registry:
    image: confluentinc/cp-schema-registry:8.1.1
    container_name: schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:19092

  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    depends_on:
      - kafka
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:19092

  cassandra:
    image: cassandra:5.0
    container_name: cassandra
    hostname: cassandra
    mem_limit: 1g
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: FinnhubCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    volumes:
      - cassandra_data:/var/lib/cassandra

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - cassandra
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

  kafka-init:
    image: apache/kafka:4.1.1
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list >/dev/null 2>&1; do
          echo "Waiting for Kafka..."
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic stock-prices-avro --partitions 3 --replication-factor 1
        echo "Kafka topic is ready."
    restart: "no"

  stream-processor:
    build:
      context: .
      dockerfile: StreamProcessor/Dockerfile
    container_name: stream-processor
    depends_on:
      kafka:
        condition: service_started
      cassandra-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CASSANDRA_CONTACT_POINTS: cassandra
      CASSANDRA_PORT: 9042
      SPARK_CHECKPOINT_DIR: /app/StreamProcessor/checkpoints/query2
    volumes:
      - stream_processor_checkpoints:/app/StreamProcessor/checkpoints
  finnhub-producer:
    build:
      context: .
      dockerfile: FinnhubProducer/Dockerfile
    container_name: finnhub-producer
    depends_on:
      kafka:
        condition: service_started
      schema-registry:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081

  cassandra-init:
    image: cassandra:5.0
    container_name: cassandra-init
    depends_on:
      - cassandra
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until cqlsh cassandra -e "DESCRIBE KEYSPACES" >/dev/null 2>&1; do
          echo "Waiting for Cassandra..."
          sleep 5
        done
        cqlsh cassandra -f /scripts/init.cql
        echo "Cassandra schema is ready."
    volumes:
      - ./Cassandra/scripts/init.cql:/scripts/init.cql:ro
    restart: "no"

volumes:
  kafka_data:
  cassandra_data:
  grafana_data:
  stream_processor_checkpoints:
